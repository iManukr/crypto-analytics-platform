apiVersion: 1

datasources:
  # The default. Every provisioned dashboard is built against this one, so the
  # observability stack works with no plugin downloads and no network access
  # after the images are pulled.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      manageAlerts: false
    editable: false

  # ClickHouse, for ad-hoc exploration of the actual data (as opposed to metrics
  # about the data). Requires the grafana-clickhouse-datasource plugin, which is
  # installed at container start via GF_INSTALL_PLUGINS and therefore needs
  # outbound network on FIRST boot only. If that fails, this datasource shows an
  # error and every dashboard in this repo keeps working, because none of them
  # depend on it.
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: analytics_marts
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
    editable: false
