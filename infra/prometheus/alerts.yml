# =============================================================================
# Alert rules.
#
# Every rule here answers "what would I want to be woken up for", not "what can
# I measure". Rules are grouped by what has actually gone wrong, and each
# carries a runbook link, because an alert without a next action is just noise
# that people learn to silence.
#
# Severity convention:
#   critical - data is being lost or the pipeline has stopped. Act now.
#   warning  - a budget is being consumed. Act today.
#   info     - context for an incident, never paged on.
# =============================================================================
groups:

  # ==========================================================================
  - name: cdc
    interval: 15s
    rules:

      - alert: DebeziumConnectorDown
        expr: cdc_connector_running == 0
        for: 1m
        labels:
          severity: critical
          component: cdc
        annotations:
          summary: "Debezium connector {{ $labels.connector }} is not RUNNING"
          description: >
            No change events are reaching Kafka. Postgres is still accepting
            writes, so this is silent data loss from the warehouse's point of
            view - the replica falls further behind every second and nothing
            downstream will complain, because everything downstream is happily
            processing stale data.
          runbook: "docs/RUNBOOK.md#debezium-connector-down"

      - alert: DebeziumTaskFailed
        expr: cdc_connector_tasks{state="FAILED"} > 0
        for: 30s
        labels:
          severity: critical
          component: cdc
        annotations:
          summary: "{{ $value }} Debezium task(s) FAILED"
          description: >
            errors.tolerance is set to 'none' deliberately, so a task failure
            means the connector refused to skip a record rather than corrupt the
            replica. Read the task trace via
            GET /connectors/crypto-oltp-cdc/status.
          runbook: "docs/RUNBOOK.md#debezium-connector-down"

      - alert: CDCLagHigh
        expr: cdc_end_to_end_lag_seconds{quantile="p95"} > 120
        for: 3m
        labels:
          severity: warning
          component: cdc
        annotations:
          summary: "CDC p95 lag is {{ $value | printf \"%.0f\" }}s (SLA 120s)"
          description: >
            Measured from the rows themselves - Postgres commit to ClickHouse
            visibility - not inferred from queue depth. Check Kafka consumer lag
            and ClickHouse merge pressure next; if both are healthy the
            bottleneck is the connector's snapshot or poll loop.
          runbook: "docs/RUNBOOK.md#cdc-lag-high"

      - alert: CDCLagSevere
        expr: cdc_end_to_end_lag_seconds{quantile="p95"} > 900
        for: 5m
        labels:
          severity: critical
          component: cdc
        annotations:
          summary: "CDC p95 lag is {{ $value | printf \"%.0f\" }}s - the replica is materially stale"
          runbook: "docs/RUNBOOK.md#cdc-lag-high"

      - alert: CDCDeadLetters
        expr: sum(cdc_dead_letters_total) > 0
        for: 1m
        labels:
          severity: critical
          component: cdc
        annotations:
          summary: "{{ $value }} CDC message(s) could not be parsed"
          description: >
            Any non-zero value means a change event did not make it into the
            warehouse, so the replica is incomplete. Inspect
            raw.cdc_dead_letters; the raw_message column holds the payload.
          runbook: "docs/RUNBOOK.md#cdc-dead-letters"

      - alert: RowParityDivergence
        expr: abs(pipeline_row_parity_delta) > 5
        for: 10m
        labels:
          severity: critical
          component: cdc
        annotations:
          summary: "OLTP and OLAP row counts differ by {{ $value }} in the comparison window"
          description: >
            A POSITIVE delta means Postgres has more rows than ClickHouse -
            change events were lost. A NEGATIVE delta means ClickHouse has more,
            which is usually duplicate events awaiting a merge and is benign.
            The comparison window already excludes the last two minutes, so this
            is not propagation delay.
          runbook: "docs/RUNBOOK.md#row-parity-divergence"

      # The rule that prevents CDC from taking down the database it observes.
      - alert: ReplicationSlotBloat
        expr: cdc_replication_slot_lag_bytes > 1073741824
        for: 5m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "Replication slot {{ $labels.slot }} is retaining {{ $value | humanize1024 }}B of WAL"
          description: >
            Postgres cannot recycle WAL that an unconsumed slot still needs. If
            this keeps climbing the source database fills its disk and stops
            accepting writes - a monitoring component causing a production
            outage. Either restore the consumer or drop the slot; do not just
            restart Postgres.
          runbook: "docs/RUNBOOK.md#replication-slot-bloat"

      - alert: ReplicationSlotInactive
        expr: cdc_replication_slot_active == 0
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "Replication slot {{ $labels.slot }} has no consumer"
          description: "WAL is being retained with nothing draining it. Precursor to ReplicationSlotBloat."
          runbook: "docs/RUNBOOK.md#replication-slot-bloat"

  # ==========================================================================
  - name: ingestion
    interval: 15s
    rules:

      - alert: IngestionDown
        expr: ingest_up == 0 or absent(ingest_up)
        for: 2m
        labels:
          severity: critical
          component: ingestion
        annotations:
          summary: "The ingestion service is not running"
          runbook: "docs/RUNBOOK.md#ingestion-stalled"

      - alert: IngestionStalled
        expr: time() - ingest_last_success_timestamp_seconds > 600
        for: 2m
        labels:
          severity: critical
          component: ingestion
        annotations:
          summary: "No rows ingested for {{ $value | printf \"%.0f\" }}s"
          description: >
            The process may still be alive - this fires on work completed, not
            on liveness. A healthy container that writes nothing is the failure
            mode a simple up/down check misses entirely.
          runbook: "docs/RUNBOOK.md#ingestion-stalled"

      - alert: DataFreshnessBreached
        expr: ingest_source_lag_seconds > 600
        for: 3m
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: "{{ $labels.symbol }} data is {{ $value | printf \"%.0f\" }}s old"
          runbook: "docs/RUNBOOK.md#ingestion-stalled"

      # Degradation must be as loud as failure. A dashboard still drawing a line
      # from synthetic data is worse than a dashboard that is visibly empty.
      - alert: IngestionUsingReplaySource
        expr: ingest_active_source{source="replay"} == 1
        for: 5m
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: "Ingestion has degraded to the offline replay generator"
          description: >
            The live API has been unreachable and the service is emitting
            SYNTHETIC data, stamped source='replay' and flagged as
            dq_synthetic_source / is_synthetic downstream. Numbers in the marts
            are not market data until this clears.
          runbook: "docs/RUNBOOK.md#replay-fallback-engaged"

      - alert: IngestionErrorRateHigh
        expr: |
          sum(rate(ingest_api_requests_total{outcome!="success"}[5m]))
            /
          clamp_min(sum(rate(ingest_api_requests_total[5m])), 0.001) > 0.5
        for: 5m
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: "Over half of source API calls are failing"
          description: "Rate-limited, geo-blocked, or the host list is exhausted. Precursor to the replay fallback."
          runbook: "docs/RUNBOOK.md#ingestion-stalled"

      - alert: IngestRejectsGrowing
        expr: increase(pipeline_ingest_rejects_total[1h]) > 10
        for: 5m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "{{ $value }} rows quarantined in the last hour"
          description: >
            Rows are failing validation at the ingest gate. Inspect
            crypto.ingest_rejects - the payload column holds the offending
            record and reason explains which invariant it broke.
          runbook: "docs/RUNBOOK.md#ingest-rejects"

  # ==========================================================================
  - name: warehouse
    interval: 15s
    rules:

      - alert: MartStale
        expr: pipeline_olap_freshness_seconds{table="fct_candles_1m"} > 3600
        for: 10m
        labels:
          severity: warning
          component: dbt
        annotations:
          summary: "fct_candles_1m has not been rebuilt in {{ $value | printf \"%.0f\" }}s"
          description: >
            The pipeline DAG runs every 15 minutes. An hour of staleness means
            it is failing or not being scheduled - check Airflow before assuming
            a data problem.
          runbook: "docs/RUNBOOK.md#mart-stale"

      - alert: DbtTestsFailing
        expr: sum(dq_dbt_test_failures) > 0
        for: 5m
        labels:
          severity: critical
          component: data-quality
        annotations:
          summary: "{{ $value }} dbt test(s) failing"
          description: >
            Tests are configured with severity=error, so the DAG has already
            stopped. Failing rows are persisted (store_failures) in the
            analytics_ops schema.
          runbook: "docs/RUNBOOK.md#dbt-test-failure"

      # Merge pressure is the ClickHouse failure that arrives without warning:
      # everything is fine until inserts start being rejected outright.
      - alert: ClickHouseTooManyParts
        expr: clickhouse_table_parts > 300
        for: 10m
        labels:
          severity: warning
          component: olap
        annotations:
          summary: "{{ $labels.database }}.{{ $labels.table }} has {{ $value }} active parts"
          description: >
            Inserts are outrunning background merges. ClickHouse hard-rejects
            writes at parts_to_throw_insert (default 3000). Usually caused by
            too-frequent small inserts - raise kafka_flush_interval_ms or
            kafka_max_block_size rather than raising the limit.
          runbook: "docs/RUNBOOK.md#clickhouse-too-many-parts"

      - alert: ClickHouseRejectingInserts
        expr: increase(ClickHouseProfileEvents_RejectedInserts[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: olap
        annotations:
          summary: "ClickHouse is rejecting inserts"
          description: "Data is actively being lost at the warehouse boundary."
          runbook: "docs/RUNBOOK.md#clickhouse-too-many-parts"

      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 10000
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is {{ $value }} messages behind on {{ $labels.topic }}"
          description: >
            ClickHouse's Kafka engine is not keeping up. Sustained lag with
            healthy CDC lag means a backlog is being worked through; sustained
            lag with rising CDC lag means it is losing ground.
          runbook: "docs/RUNBOOK.md#kafka-consumer-lag"

  # ==========================================================================
  - name: orchestration
    interval: 30s
    rules:

      - alert: AirflowDagFailing
        expr: increase(airflow_dagrun_duration_failed_count[1h]) > 0
        for: 1m
        labels:
          severity: warning
          component: orchestration
        annotations:
          summary: "A DAG run failed in the last hour"
          runbook: "docs/RUNBOOK.md#airflow-dag-failure"

      - alert: AirflowSchedulerHeartbeatMissing
        expr: absent(airflow_scheduler_heartbeat) or increase(airflow_scheduler_heartbeat[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: orchestration
        annotations:
          summary: "The Airflow scheduler is not heartbeating"
          description: "Nothing is being scheduled. The streaming path continues; the modelling path has stopped."
          runbook: "docs/RUNBOOK.md#airflow-dag-failure"

  # ==========================================================================
  - name: platform
    interval: 30s
    rules:

      - alert: ExporterTargetDown
        expr: exporter_target_up == 0
        for: 3m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "The pipeline exporter cannot reach {{ $labels.target }}"
          description: >
            Data-quality metrics for that target are stale. Note this is the
            monitoring being broken, not necessarily the pipeline - confirm
            against the target's own metrics before escalating.
          runbook: "docs/RUNBOOK.md#observability-gaps"

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: >
            A scrape target stopped answering. Its metrics are gone, which means
            every alert that depends on them silently cannot fire - the most
            dangerous state for a monitoring system to be in, because the
            dashboard looks calm.
          runbook: "docs/RUNBOOK.md#observability-gaps"
